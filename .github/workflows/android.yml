name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install SDK 37
        uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6'
      - name: Build, unit tests and Android lint
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:bundleRelease
      - name: Verify privacy manifest
        run: |
          if grep -REn 'android.permission.(INTERNET|ACCESS_BACKGROUND_LOCATION|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE|CAMERA)' app/src/main/AndroidManifest.xml; then
            echo 'Unexpected permission' >&2; exit 1
          fi
      - name: Dependency vulnerability review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - name: Upload unsigned build outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: parknote-unsigned
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 7
